<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שיר בדיקה / A Test Song</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
header h1 { margin-bottom: 0.2em; }
header .meta { color: #555; font-size: 0.9em; }
section { margin: 1.2em 0; }
section.chorus { font-style: italic; border-left: 3px solid #ccc; padding-left: 0.8em; }
section.tab pre { background: #f6f6f6; padding: 0.6em; border-radius: 4px; overflow-x: auto; }
.section-label { font-weight: 600; color: #555; margin-bottom: 0.3em; }
p.line { margin: 0 0 0.6em 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.1; white-space: pre-wrap; }
p.line .pair { display: inline-flex; flex-direction: column; align-items: flex-start; vertical-align: bottom; }
p.line .chord { color: #b00; font-weight: 600; }
p.line .annotation { color: #06c; font-style: italic; }
p.line .lyric { white-space: pre; }
p.comment { margin: 0.4em 0; color: #555; }
p.comment.italic { font-style: italic; }
p.comment.box { border: 1px solid #aaa; padding: 0.3em 0.6em; display: inline-block; }
.chord-diagrams .diagrams { display: flex; flex-wrap: wrap; gap: 0.6em 1em; }
.chord-diagrams figure { margin: 0; text-align: center; }
.chord-diagrams figcaption { font-weight: 600; font-size: 0.9em; }
</style>
</head>
<body>
<header dir="rtl">
  <h1 dir="auto">שיר בדיקה / A Test Song</h1>
  <p class="meta">Artist: <bdi>Test Band</bdi></p>
</header>
<main dir="rtl">
  <p class="line" dir="auto">&nbsp;</p>
<p class="comment" dir="auto">בית ראשון / First verse</p>
  <p class="line" dir="auto"><span class="pair"><span class="chord" dir="ltr" data-chord="A/F#">A/F#</span><span class="lyric">שלום, </span></span><span class="pair"><span class="chord" dir="ltr" data-chord="C#m7">C#m7</span><span class="lyric">מה נשמע? </span></span><span class="pair"><span class="chord" dir="ltr" data-chord="G">G</span><span class="lyric">הכל בסדר.</span></span></p>
  <p class="line" dir="auto"><span class="pair"><span class="chord" dir="ltr" data-chord="D">D</span><span class="lyric">Hello there, </span></span><span class="pair"><span class="chord" dir="ltr" data-chord="Bm">Bm</span><span class="lyric">how are </span></span><span class="pair"><span class="chord" dir="ltr" data-chord="G">G</span><span class="lyric">you?</span></span></p>
  <p class="line" dir="auto"><span class="pair"><span class="chord" dir="ltr" data-chord="D">D</span><span class="lyric">שורה עם </span></span><span class="pair"><span class="chord" dir="ltr" data-chord="A">A</span><span class="lyric">English in the middle, </span></span><span class="pair"><span class="chord" dir="ltr" data-chord="Bm">Bm</span><span class="lyric">וחזרה לעברית!</span></span></p>
  <p class="line" dir="auto"><span class="pair"><span class="chord" dir="ltr" data-chord="Em">Em</span><span class="lyric">123 </span></span><span class="pair"><span class="chord" dir="ltr" data-chord="A7">A7</span><span class="lyric">מספרים: 4, 5, 6.</span></span></p>
  <p class="line" dir="auto">&nbsp;</p>
<section class="chorus">
  <p class="section-label" dir="auto">פזמון / Chorus</p>
  <p class="line" dir="auto"><span class="pair"><span class="chord" dir="ltr" data-chord="G">G</span><span class="lyric">לא ב</span></span><span class="pair"><span class="chord" dir="ltr" data-chord="D">D</span><span class="lyric">דיוק, </span></span><span class="pair"><span class="chord" dir="ltr" data-chord="Em">Em</span><span class="lyric">not really </span></span><span class="pair"><span class="chord" dir="ltr" data-chord="C">C</span><span class="lyric">sure</span></span></p>
</section>
</main>
</body></html>
