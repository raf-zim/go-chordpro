<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הבה נגילה</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
header h1 { margin-bottom: 0.2em; }
header .meta { color: #555; font-size: 0.9em; }
section { margin: 1.2em 0; }
section.chorus { font-style: italic; border-left: 3px solid #ccc; padding-left: 0.8em; }

p.line .lyric { white-space: pre; }
p.comment { margin: 0.4em 0; color: #555; }
p.comment.italic { font-style: italic; }

.chord-diagrams .diagrams { display: flex; flex-wrap: wrap; gap: 0.6em 1em; }
.chord-diagrams figure { margin: 0; text-align: center; }
.chord-diagrams figcaption { font-weight: 600; font-size: 0.9em; }
</style>
</head>
<body>
<header dir="rtl">
  <h1 dir="auto">הבה נגילה</h1>
  <p class="subtitle" dir="auto">Hava Nagila</p>

<main dir="rtl">

  <p class="line" dir="auto"><span class="pair"><span class="chord" dir="ltr" data-chord="Dm">Dm</span><span class="lyric">הָבָה נָגִי</span></span><span class="pair"><span class="chord" dir="ltr" data-chord="Gm">Gm</span><span class="lyric">לָה, הָבָה נָגִי</span></span><span class="pair"><span class="chord" dir="ltr" data-chord="Dm">Dm</span><span class="lyric">לָה</span></span></p>

</section>

<section class="chorus">
  <p class="section-label" dir="auto">פזמון</p>
  <p class="line" dir="auto"><span class="pair"><span class="chord" dir="ltr" data-chord="Dm">Dm</span><span class="lyric">עוּרוּ, </span></span><span class="pair"><span class="chord" dir="ltr" data-chord="Gm">Gm</span><span class="lyric">עוּרוּ אַ</span></span><span class="pair"><span class="chord" dir="ltr" data-chord="Dm">Dm</span><span class="lyric">חִים</span></span></p>
  <p class="line" dir="auto"><span class="pair"><span class="chord" dir="ltr" data-chord="A7">A7</span><span class="lyric">עוּרוּ אַחִים בְּלֵב שָׂ</span></span><span class="pair"><span class="chord" dir="ltr" data-chord="Dm">Dm</span><span class="lyric">מֵחַ</span></span></p>
</section>
  <p class="line" dir="auto">&nbsp;</p>
