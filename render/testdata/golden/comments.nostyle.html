<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comments and Annotations</title>
</head>
<body>
<header>
  <h1>Comments and Annotations</h1>
</header>
<main>
<p class="comment">Plain comment</p>
<p class="comment italic">Italic comment</p>
<p class="comment box">Boxed comment</p>
  <p class="line"><span class="pair"><span class="annotation">Slowly</span><span class="lyric">Start </span></span><span class="pair"><span class="chord">G</span><span class="lyric">soft, </span></span><span class="pair"><span class="annotation">louder</span><span class="lyric">then </span></span><span class="pair"><span class="chord">C</span><span class="lyric">loud</span></span></p>
  <p class="line"><span class="lyric">Lyrics with no chords at all</span></p>
  <p class="line"><span class="pair"><span class="chord">G</span><span class="lyric"> </span></span><span class="pair"><span class="chord">C</span><span class="lyric"> </span></span><span class="pair"><span class="chord">D</span><span class="lyric"> chords with no lyrics</span></span></p>
</main>
</body></html>
