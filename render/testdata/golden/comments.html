<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comments and Annotations</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
header h1 { margin-bottom: 0.2em; }
header .meta { color: #555; font-size: 0.9em; }
section { margin: 1.2em 0; }
section.chorus { font-style: italic; border-left: 3px solid #ccc; padding-left: 0.8em; }
section.tab pre { background: #f6f6f6; padding: 0.6em; border-radius: 4px; overflow-x: auto; }
.section-label { font-weight: 600; color: #555; margin-bottom: 0.3em; }
p.line { margin: 0 0 0.6em 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.1; white-space: pre-wrap; }
p.line .pair { display: inline-flex; flex-direction: column; align-items: flex-start; vertical-align: bottom; }
p.line .chord { color: #b00; font-weight: 600; }
p.line .annotation { color: #06c; font-style: italic; }
p.line .lyric { white-space: pre; }
p.comment { margin: 0.4em 0; color: #555; }
p.comment.italic { font-style: italic; }
p.comment.box { border: 1px solid #aaa; padding: 0.3em 0.6em; display: inline-block; }
.chord-diagrams .diagrams { display: flex; flex-wrap: wrap; gap: 0.6em 1em; }
.chord-diagrams figure { margin: 0; text-align: center; }
.chord-diagrams figcaption { font-weight: 600; font-size: 0.9em; }
</style>
</head>
<body>
<header>
  <h1>Comments and Annotations</h1>
</header>
<main>
<p class="comment">Plain comment</p>
<p class="comment italic">Italic comment</p>
<p class="comment box">Boxed comment</p>
  <p class="line"><span class="pair"><span class="annotation">Slowly</span><span class="lyric">Start </span></span><span class="pair"><span class="chord" data-chord="G">G</span><span class="lyric">soft, </span></span><span class="pair"><span class="annotation">louder</span><span class="lyric">then </span></span><span class="pair"><span class="chord" data-chord="C">C</span><span class="lyric">loud</span></span></p>
  <p class="line"><span class="lyric">Lyrics with no chords at all</span></p>
  <p class="line"><span class="pair"><span class="chord" data-chord="G">G</span><span class="lyric"> </span></span><span class="pair"><span class="chord" data-chord="C">C</span><span class="lyric"> </span></span><span class="pair"><span class="chord" data-chord="D">D</span><span class="lyric"> chords with no lyrics</span></span></p>
</main>
</body></html>
